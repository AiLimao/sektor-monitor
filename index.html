<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sektor-Monitor">
<meta name="robots" content="noindex">
<title>Sektor-Monitor</title>
<!--
  Sektor-Monitor Web v0.4.0
  Startseite: Uebersicht der Maerkte (US-ETFs als Stellvertreter fuer die Futures).
  Klick auf S&P 500 oder Nasdaq 100 oeffnet die Aufschluesselung:
    Veraenderung = Tagesveraenderung in Prozent
    Beitrag      = Veraenderung x Gewicht im Index (Prozentpunkte)
  Kurse: Finnhub (finnhub.io), direkt aus dem Browser. Der Zugangsschluessel wird
  einmal je Geraet eingegeben und nur im Browser dieses Geraets gespeichert.
  Maerkte und Gewichte: unten im Skript, Abschnitte MAERKTE und ANSICHTEN.
  Aenderungen v0.4.0: Startseite mit Maerkten; Sektoren-Tabelle als Unterseite von
  S&P 500; neue Unterseite Nasdaq 100 mit den groessten Aktien und Rest-Balken.
-->
<style>
:root{
  --bg:#f6f7f5; --flaeche:#ffffff; --text:#1b211e; --leise:#48524d; --linie:#dfe4e0;
  --plus:#1f7a4d; --minus:#b3372f; --spur:#eceeeb; --warn:#8a5a00; --warnbg:#fdf3d9;
  --zahl: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --schrift: -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131715; --flaeche:#1b201d; --text:#e8ece9; --leise:#98a39d; --linie:#2c3430;
    --plus:#4cc38a; --minus:#f0786e; --spur:#232a26; --warn:#f2c661; --warnbg:#3a2f12;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 var(--schrift);
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.rahmen{max-width:1120px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
h1{font-size:22px;margin:0;font-weight:650}
.status{color:var(--leise);font-size:15px}
.punkt{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--leise);margin-right:6px}
.punkt.offen{background:var(--plus)}
.hinweis{background:var(--warnbg);color:var(--warn);padding:10px 14px;border-radius:6px;margin-top:12px;font-size:16px}
.index{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:baseline;margin:16px 0 4px}
.index .gross{font:700 34px/1.1 var(--zahl)}
.index .neben{color:var(--text);font-size:16px}
.leiste{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:12px 0 8px}
.knoepfe{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:15px;color:var(--text);background:var(--flaeche);border:1px solid var(--linie);
  border-radius:6px;padding:6px 10px;cursor:pointer}
button.haupt{background:var(--plus);color:#fff;border-color:var(--plus);font-weight:600;padding:9px 16px}
button:focus-visible,input:focus-visible{outline:2px solid var(--plus);outline-offset:2px}
.tafel{background:var(--flaeche);border:1px solid var(--linie);border-radius:8px;overflow:hidden}
.zeile{display:grid;grid-template-columns:minmax(150px,1.2fr) 70px 1.6fr 1.6fr;gap:12px 36px;align-items:center;
  padding:9px 16px;border-top:1px solid var(--linie)}
.zeile:first-child{border-top:0}
.zeile.kopf{color:var(--text);font-size:13.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;padding-block:11px}
.zeile.idx{font-weight:650;border-top:2px solid var(--text)}
.name{min-width:0;font-weight:550}
.name small{color:var(--leise);font-family:var(--zahl);font-size:13.5px;margin-left:8px;font-weight:400}
.gew{font:600 15.5px var(--zahl);color:var(--text);text-align:right}
.balken{display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:center;min-width:0}
.spur{position:relative;height:18px;background:var(--spur);border-radius:3px}
.spur::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--leise);opacity:.6}
.fuell{position:absolute;top:0;bottom:0;border-radius:2px;transition:width .4s}
.fuell.plus{background:var(--plus);left:50%}
.fuell.minus{background:var(--minus);right:50%}
.wert{font:650 15.5px var(--zahl);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wert.plus{color:var(--plus)} .wert.minus{color:var(--minus)}
.fehler{color:var(--warn);font-size:13.5px}
footer{color:var(--leise);font-size:14.5px;margin-top:12px;display:grid;gap:4px}
.karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:8px;padding:20px;margin-top:20px;max-width:640px}
.karte h2{font-size:19px;margin:0 0 8px}
.karte p{margin:0 0 14px;color:var(--leise);font-size:16px}
.karte label{display:block;font-weight:600;margin-bottom:6px}
.karte input{font:16px var(--zahl);width:100%;padding:10px;border:1px solid var(--linie);border-radius:6px;
  background:var(--bg);color:var(--text);margin-bottom:14px}
@media (max-width:640px){
  .zeile{grid-template-columns:1fr 70px;gap:4px 8px}
  .zeile .balken{grid-column:1 / -1}
  .zeile.kopf .balken{display:none}
  .balken::before{font-size:13px;color:var(--leise);grid-column:1 / -1;margin-bottom:-4px}
  .balken.v::before{content:"Veränderung"} .balken.b::before{content:"Beitrag"}
}
@media (prefers-reduced-motion: reduce){.fuell{transition:none}}
.zeile.start{grid-template-columns:minmax(190px,1.3fr) 110px 2.2fr 22px}
.zeile.klick{cursor:pointer}
.zeile.klick:hover{background:var(--spur)}
.zeile.gruppe{display:block;background:var(--bg);color:var(--leise);font-size:13.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;padding-block:8px}
.pfeil{color:var(--leise);font-size:20px;text-align:right}
.kurs{font:600 15.5px var(--zahl);text-align:right;font-variant-numeric:tabular-nums}
a.zurueck{color:var(--text);text-decoration:none;font-size:16px;border:1px solid var(--linie);background:var(--flaeche);border-radius:6px;padding:6px 12px;display:inline-block;margin-top:14px}
a.zurueck:focus-visible,.zeile.klick:focus-visible{outline:2px solid var(--plus);outline-offset:-2px}
.zeile.rest{font-style:italic}
@media (max-width:640px){
  .zeile.start{grid-template-columns:1fr 90px 22px;gap:4px 8px}
  .zeile.start .balken{grid-column:1 / -1;grid-row:2}
  .zeile.start .balken::before{content:none}
  .zeile.start.kopf .balken{display:none}
}
</style>
</head>
<body>
<div class="rahmen">
  <header>
    <h1 id="titel">Sektor-Monitor</h1>
    <div class="status"><span id="punkt" class="punkt"></span><span id="status">Noch kein Abruf</span></div>
  </header>
  <div id="hinweis" class="hinweis" hidden></div>

  <form id="einrichtung" class="karte" hidden>
    <h2>Einmalige Einrichtung auf diesem Gerät</h2>
    <p>Die Seite holt die Kurse direkt bei Finnhub. Dafür braucht sie deinen Finnhub-Zugangsschlüssel (im Finnhub-Dashboard unter „API Key“). Er wird nur im Browser dieses Geräts gespeichert.</p>
    <label for="schluessel">Finnhub-Zugangsschlüssel</label>
    <input id="schluessel" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    <button class="haupt" type="submit">Speichern und starten</button>
  </form>

  <div id="inhalt" hidden>
    <a id="zurueck" class="zurueck" href="#" hidden>‹ Übersicht</a>
    <div class="index" id="kopfzeile" hidden>
      <span class="neben" id="idxn"></span>
      <span id="idxv" class="gross">–</span>
      <span id="idxs" class="neben"></span>
      <span id="summe" class="neben"></span>
    </div>
    <div class="leiste">
      <span class="status" id="markt"></span>
      <span class="knoepfe">
        <button id="sort" type="button" hidden>Sortierung: nach Beitrag</button>
        <button id="neu" type="button">Schlüssel ändern</button>
      </span>
    </div>
    <div class="tafel" id="tafel"></div>
    <footer>
      <div id="erklaerung"></div>
      <div id="fuss"></div>
    </footer>
  </div>
</div>
<script>
"use strict";
var VERSION = "0.4.0";
var INTERVALL = 60;            // Sekunden zwischen zwei Abrufen

// ---------- MAERKTE: Zeilen der Startseite ----------
// symbol = US-ETF, der bei Finnhub abgefragt wird; fuer = Future, fuer den er steht;
// ansicht = Unterseite, die ein Klick oeffnet (siehe ANSICHTEN)
var MAERKTE = [
  {gruppe: "Indizes"},
  {symbol: "SPY", name: "S&P 500", fuer: "MES", ansicht: "spy"},
  {symbol: "QQQ", name: "Nasdaq 100", fuer: "MNQ", ansicht: "qqq"},
  {symbol: "RSP", name: "S&P 500 gleichgewichtet", fuer: ""},
  {gruppe: "Edelmetalle"},
  {symbol: "GLD", name: "Gold", fuer: "GC"},
  {symbol: "SLV", name: "Silber", fuer: "SI"}
];

// ---------- ANSICHTEN: Aufschluesselung eines Index ----------
// gewicht = Anteil am Index in Prozent. rest: true = alle nicht genannten Werte
// erscheinen als ein gemeinsamer Balken (Indexbewegung minus genannte Beitraege).
var ANSICHTEN = {
  spy: {titel: "S&P 500", index: "SPY", spalte: "Sektor", rest: false,
    stand: "30.09.2026, S&P Dow Jones Indices",
    teile: [
      {symbol: "XLK",  name: "Technologie",       gewicht: 39.9},
      {symbol: "XLF",  name: "Finanzen",          gewicht: 11.4},
      {symbol: "XLC",  name: "Kommunikation",     gewicht: 9.7},
      {symbol: "XLV",  name: "Gesundheit",        gewicht: 9.3},
      {symbol: "XLY",  name: "Zyklischer Konsum", gewicht: 8.6},
      {symbol: "XLI",  name: "Industrie",         gewicht: 8.1},
      {symbol: "XLP",  name: "Basiskonsum",       gewicht: 4.3},
      {symbol: "XLE",  name: "Energie",           gewicht: 3.4},
      {symbol: "XLU",  name: "Versorger",         gewicht: 1.9},
      {symbol: "XLB",  name: "Grundstoffe",       gewicht: 1.7},
      {symbol: "XLRE", name: "Immobilien",        gewicht: 1.7}
    ]},
  qqq: {titel: "Nasdaq 100", index: "QQQ", spalte: "Aktie", rest: true,
    stand: "abgerufen 08.10.2026, slickcharts.com",
    teile: [
      {symbol: "NVDA",  name: "Nvidia",    gewicht: 13.03},
      {symbol: "AAPL",  name: "Apple",     gewicht: 11.17},
      {symbol: "GOOGL", name: "Alphabet",  gewicht: 9.70},   // Klasse A + C zusammen
      {symbol: "MSFT",  name: "Microsoft", gewicht: 8.94},
      {symbol: "AMZN",  name: "Amazon",    gewicht: 6.37},
      {symbol: "SPCX",  name: "SpaceX",    gewicht: 5.02},
      {symbol: "META",  name: "Meta",      gewicht: 4.18},
      {symbol: "AVGO",  name: "Broadcom",  gewicht: 4.09},
      {symbol: "TSLA",  name: "Tesla",     gewicht: 3.39},
      {symbol: "MU",    name: "Micron",    gewicht: 2.79},
      {symbol: "AMD",   name: "AMD",       gewicht: 2.40}
    ]}
};
// --------------------------------------------------------------------------

var SORT_BEITRAG = true, schluessel = null, letzte = null, timer = null, laeuft = false, ansicht = null;
function lies(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function schreib(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
SORT_BEITRAG = lies("sort") !== "fest";
schluessel = lies("finnhub_key");

function el(id) { return document.getElementById(id); }
function neu(tag, kl, text) { var e = document.createElement(tag); if (kl) e.className = kl; if (text !== undefined) e.textContent = text; return e; }
function zahl(x, st) { return (x > 0 ? "+" : x < 0 ? "−" : "±") + Math.abs(x).toFixed(st).replace(".", ","); }
function preis(x) { return x.toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function klasse(x) { return x > 0 ? "plus" : x < 0 ? "minus" : ""; }
function uhr(ms) { return new Date(ms).toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit", second: "2-digit"}); }

// Regulaerer US-Handel Mo-Fr 9:30-16:00 New Yorker Zeit (Feiertage unberuecksichtigt)
function marktOffen() {
  var t = new Intl.DateTimeFormat("en-US", {timeZone: "America/New_York", weekday: "short",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23"}).formatToParts(new Date());
  var w = "", h = 0, m = 0;
  t.forEach(function (p) { if (p.type === "weekday") w = p.value; if (p.type === "hour") h = +p.value; if (p.type === "minute") m = +p.value; });
  var min = h * 60 + m;
  return w !== "Sat" && w !== "Sun" && min >= 570 && min < 960;
}

var FEHLERTEXT = {
  401: "Finnhub lehnt den Schlüssel ab",
  403: "im kostenlosen Zugang nicht freigegeben",
  429: "Abfragelimit bei Finnhub erreicht"
};
// Finnhub-Antwort: c = aktueller Kurs, pc = Vortagesschluss, t = Zeitstempel
function holeKurs(symbol) {
  var url = "https://finnhub.io/api/v1/quote?symbol=" + encodeURIComponent(symbol) + "&token=" + encodeURIComponent(schluessel);
  return fetch(url, {cache: "no-store", credentials: "omit"}).then(function (r) {
    if (!r.ok) { var e = new Error(FEHLERTEXT[r.status] || ("HTTP " + r.status)); e.code = r.status; throw e; }
    return r.json();
  }).then(function (d) {
    if (!d.c || !d.pc) { var k = new Error("Finnhub kennt das Symbol nicht oder hat keinen Kurs"); k.code = -1; throw k; }
    return {kurs: d.c, vortag: d.pc, zeit: d.t || null, veraenderung: (d.c / d.pc - 1) * 100};
  });
}
function holeAlle(symbole) {
  return Promise.all(symbole.map(function (sym) {
    return holeKurs(sym).then(function (w) { return {wert: w}; },
      function (e) { return {wert: null, fehler: e.code ? e.message : "keine Verbindung zu Finnhub", code: e.code || 0}; });
  }));
}

function berechneStart(erg) {
  var i = 0, zeit = null, fehler = [], codes = [];
  var zeilen = MAERKTE.map(function (m) {
    if (m.gruppe) return {gruppe: m.gruppe};
    var e = erg[i++], z = {symbol: m.symbol, name: m.name, fuer: m.fuer, ansicht: m.ansicht || null, kurs: null, veraenderung: null, fehler: null};
    if (e.wert) { z.kurs = e.wert.kurs; z.veraenderung = e.wert.veraenderung; zeit = zeit || e.wert.zeit; }
    else { z.fehler = e.fehler; fehler.push(e.fehler); codes.push(e.code); }
    return z;
  });
  return {art: "start", abruf: Date.now(), offen: marktOffen(), zeilen: zeilen, kurszeit: zeit,
    fehler: fehler, anzahl: i, schluesselAbgelehnt: codes.indexOf(401) >= 0};
}
function berechneAnsicht(a, erg) {
  var summe = 0, gewSumme = 0, fehler = [], codes = [];
  var teile = a.teile.map(function (s, i) {
    var e = erg[i], z = {symbol: s.symbol, name: s.name, gewicht: s.gewicht, veraenderung: null, beitrag: null, fehler: null};
    if (e.wert) { z.veraenderung = e.wert.veraenderung; z.beitrag = z.veraenderung * s.gewicht / 100; summe += z.beitrag; gewSumme += s.gewicht; }
    else { z.fehler = e.fehler; fehler.push(e.fehler); codes.push(e.code); }
    return z;
  });
  var ie = erg[a.teile.length], index = {veraenderung: null, stand: null, kurszeit: null, fehler: null};
  if (ie.wert) { index.veraenderung = ie.wert.veraenderung; index.stand = ie.wert.kurs; index.kurszeit = ie.wert.zeit; }
  else { index.fehler = ie.fehler; fehler.push(ie.fehler); codes.push(ie.code); }
  var vollstaendig = teile.every(function (t) { return t.beitrag !== null; });
  var rest = null;
  if (a.rest && index.veraenderung !== null) {
    // Rest = alles, was nicht einzeln mit Kurs vorliegt
    var rg = 100 - gewSumme, rb = index.veraenderung - summe;
    rest = {symbol: "", name: "Rest (übrige Werte)", gewicht: rg, beitrag: rb, veraenderung: rg > 0 ? rb / rg * 100 : null, fehler: null, rest: true};
  }
  return {art: "ansicht", ansicht: a, abruf: Date.now(), offen: marktOffen(), index: index, teile: teile, rest: rest,
    summe: !a.rest && vollstaendig ? summe : null,
    differenz: !a.rest && vollstaendig && index.veraenderung !== null ? index.veraenderung - summe : null,
    fehler: fehler, anzahl: a.teile.length + 1, schluesselAbgelehnt: codes.indexOf(401) >= 0};
}

function balken(wert, max, art, einheit) {
  var d = neu("div", "balken " + art), spur = neu("div", "spur"), w = neu("div", "wert");
  if (wert === null) w.textContent = "–";
  else {
    var f = neu("div", "fuell " + klasse(wert));
    f.style.width = (max > 0 ? Math.min(50, Math.abs(wert) / max * 50) : 0) + "%";
    spur.appendChild(f);
    w.textContent = zahl(wert, 2) + einheit; w.className = "wert " + klasse(wert);
  }
  d.appendChild(spur); d.appendChild(w); return d;
}
function namensfeld(name, klein, fehler) {
  var n = neu("div", "name", name);
  if (klein) n.appendChild(neu("small", "", klein));
  if (fehler) n.appendChild(neu("small", "fehler", " kein Kurs"));
  return n;
}
function kopf(spalten, kl) {
  var k = neu("div", "zeile kopf" + (kl ? " " + kl : ""));
  spalten.forEach(function (x) {
    var c = neu("div", x[1] || "", x[0]);
    if (x[2]) c.style.textAlign = "right";
    k.appendChild(c);
  });
  return k;
}

function zeichneStart(d) {
  var t = el("tafel"); t.textContent = "";
  t.appendChild(kopf([["Markt"], ["Kurs", "", true], ["Veränderung heute", "balken"], [""]], "start"));
  var max = Math.max.apply(null, d.zeilen.map(function (z) { return Math.abs(z.veraenderung || 0); }).concat([0.01]));
  d.zeilen.forEach(function (z) {
    if (z.gruppe) { t.appendChild(neu("div", "zeile gruppe", z.gruppe)); return; }
    var r = neu("div", "zeile start" + (z.ansicht ? " klick" : ""));
    r.appendChild(namensfeld(z.name, z.symbol + (z.fuer ? " · für " + z.fuer : ""), z.fehler));
    r.appendChild(neu("div", "kurs", z.kurs === null ? "–" : preis(z.kurs)));
    r.appendChild(balken(z.veraenderung, max, "v", " %"));
    r.appendChild(neu("div", "pfeil", z.ansicht ? "›" : ""));
    if (z.ansicht) {
      r.tabIndex = 0; r.setAttribute("role", "link"); r.setAttribute("aria-label", z.name + " aufschlüsseln");
      var geh = function () { location.hash = z.ansicht; };
      r.addEventListener("click", geh);
      r.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); geh(); } });
    }
    t.appendChild(r);
  });
  el("erklaerung").textContent = "Die Kurse stammen von US-ETFs, die den jeweiligen Markt abbilden. Sie bewegen sich nur zur US-Börsenzeit. Zeilen mit Pfeil lassen sich antippen und zeigen, welche Sektoren oder Aktien den Index bewegen.";
  el("fuss").textContent = "Kurse: Finnhub. Version " + VERSION + ".";
}
function zeichneAnsicht(d) {
  var a = d.ansicht, t = el("tafel"); t.textContent = "";
  t.appendChild(kopf([[a.spalte], ["Gewicht", "", true], ["Veränderung heute", "balken"], ["Beitrag zum Index", "balken"]]));
  var teile = d.teile.slice();
  if (SORT_BEITRAG) teile.sort(function (x, y) { return (y.beitrag === null ? -99 : y.beitrag) - (x.beitrag === null ? -99 : x.beitrag); });
  if (d.rest) teile.push(d.rest);
  var iv = d.index.veraenderung;
  var maxV = Math.max.apply(null, teile.map(function (s) { return Math.abs(s.veraenderung || 0); }).concat([Math.abs(iv || 0), 0.01]));
  var maxB = Math.max.apply(null, teile.map(function (s) { return Math.abs(s.beitrag || 0); }).concat([Math.abs(iv || 0), 0.01]));
  function zeile(z, extra) {
    var r = neu("div", "zeile" + (extra ? " " + extra : ""));
    r.appendChild(namensfeld(z.name, z.symbol, z.fehler));
    r.appendChild(neu("div", "gew", z.gewicht === null ? "" : z.gewicht.toFixed(1).replace(".", ",") + " %"));
    r.appendChild(balken(z.veraenderung, maxV, "v", " %"));
    r.appendChild(balken(z.beitrag, maxB, "b", " PP"));
    return r;
  }
  teile.forEach(function (z) { t.appendChild(zeile(z, z.rest ? "rest" : "")); });
  t.appendChild(zeile({name: a.titel, symbol: a.index, gewicht: null, veraenderung: iv, beitrag: iv}, "idx"));

  el("idxn").textContent = a.titel + " (über " + a.index + ")";
  var e = el("idxv");
  e.textContent = iv === null ? "–" : zahl(iv, 2) + " %";
  e.style.color = iv > 0 ? "var(--plus)" : iv < 0 ? "var(--minus)" : "";
  el("idxs").textContent = d.index.stand === null ? "" : a.index + " " + preis(d.index.stand);
  el("summe").textContent = d.summe === null ? "" : "Summe der Beiträge: " + zahl(d.summe, 2) + " PP" +
    (d.differenz === null ? "" : " · Differenz zum Index: " + zahl(d.differenz, 2) + " PP");
  el("erklaerung").textContent = "Veränderung = Tagesveränderung in Prozent. Beitrag = Veränderung × Gewicht im Index, in Prozentpunkten (PP)." +
    (a.rest ? " Rest = Indexbewegung minus die Beiträge der einzeln genannten Werte." : " Die Beiträge zusammen ergeben ungefähr die Indexbewegung.");
  el("fuss").textContent = "Kurse: Finnhub, Index über " + a.index + ". Gewichte: " + a.stand + ". Version " + VERSION + ".";
}
function zeichne(d) {
  var istStart = d.art === "start";
  el("titel").textContent = istStart ? "Sektor-Monitor" : "Sektor-Monitor · " + d.ansicht.titel;
  el("zurueck").hidden = istStart; el("kopfzeile").hidden = istStart; el("sort").hidden = istStart;
  if (istStart) zeichneStart(d); else zeichneAnsicht(d);
  var kz = istStart ? d.kurszeit : d.index.kurszeit;
  el("punkt").className = "punkt" + (d.offen ? " offen" : "");
  el("markt").textContent = d.offen ? "US-Markt geöffnet" :
    "US-Markt geschlossen (regulärer Handel 14:30–21:00 Uhr Lissabon)" +
    (kz ? " – Werte vom letzten Handelstag (" + new Date(kz * 1000).toLocaleDateString("de-DE") + ")" : "");
  el("status").textContent = "Abruf " + uhr(d.abruf) + " · aktualisiert alle " + INTERVALL + " s";
  var h = el("hinweis"), n = d.fehler.length;
  if (d.schluesselAbgelehnt) { h.hidden = false; h.textContent = "Finnhub lehnt den Schlüssel ab. Tippe auf „Schlüssel ändern“ und gib ihn neu ein."; }
  else if (n === d.anzahl) { h.hidden = false; h.textContent = "Finnhub liefert gerade keine Kurse (" + d.fehler[0] + "). Die Seite versucht es automatisch weiter."; }
  else if (n) { h.hidden = false; h.textContent = "Für " + n + (n === 1 ? " Wert" : " Werte") + " kam kein Kurs (" + d.fehler[0] + ")." +
      (istStart ? "" : d.ansicht.rest ? " Diese Werte stecken im Rest-Balken." : " Die Summe der Beiträge ist deshalb ausgeblendet."); }
  else h.hidden = true;
}

function lade() {
  if (!schluessel || laeuft) return;
  laeuft = true;
  var fuer = ansicht, a = ansicht ? ANSICHTEN[ansicht] : null;
  var symbole = a ? a.teile.map(function (s) { return s.symbol; }).concat([a.index])
                  : MAERKTE.filter(function (m) { return m.symbol; }).map(function (m) { return m.symbol; });
  holeAlle(symbole).then(function (erg) {
    if (fuer !== ansicht) return;            // inzwischen wurde die Seite gewechselt
    letzte = a ? berechneAnsicht(a, erg) : berechneStart(erg); zeichne(letzte);
  }).finally(function () { laeuft = false; if (fuer !== ansicht) lade(); });
}
function waehleAnsicht() {
  var h = location.hash.replace("#", "");
  ansicht = ANSICHTEN[h] ? h : null;
  letzte = null;
  if (!schluessel) return;
  el("tafel").textContent = ""; el("hinweis").hidden = true;
  el("zurueck").hidden = !ansicht; el("kopfzeile").hidden = true; el("sort").hidden = !ansicht;
  el("titel").textContent = ansicht ? "Sektor-Monitor · " + ANSICHTEN[ansicht].titel : "Sektor-Monitor";
  el("status").textContent = "Lade Kurse …";
  window.scrollTo(0, 0);
  lade();
}
function starte() {
  el("einrichtung").hidden = true; el("inhalt").hidden = false;
  waehleAnsicht();
  if (timer) clearInterval(timer);
  timer = setInterval(function () { if (!document.hidden) lade(); }, INTERVALL * 1000);
}
function zeigeEinrichtung() {
  if (timer) clearInterval(timer);
  el("inhalt").hidden = true; el("hinweis").hidden = true; el("einrichtung").hidden = false;
  el("titel").textContent = "Sektor-Monitor"; el("status").textContent = "Noch kein Abruf";
  el("schluessel").value = "";
}
window.addEventListener("hashchange", waehleAnsicht);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && schluessel && (!letzte || Date.now() - letzte.abruf > INTERVALL * 1000)) lade();
});
el("einrichtung").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var k = el("schluessel").value.trim();
  if (!k) return;
  schluessel = k; schreib("finnhub_key", k); starte();
});
el("neu").addEventListener("click", function () { schluessel = null; schreib("finnhub_key", null); zeigeEinrichtung(); });
el("sort").addEventListener("click", function () {
  SORT_BEITRAG = !SORT_BEITRAG; schreib("sort", SORT_BEITRAG ? "beitrag" : "fest");
  this.textContent = "Sortierung: " + (SORT_BEITRAG ? "nach Beitrag" : "feste Reihenfolge");
  if (letzte && letzte.art === "ansicht") zeichne(letzte);
});
el("sort").textContent = "Sortierung: " + (SORT_BEITRAG ? "nach Beitrag" : "feste Reihenfolge");
if (schluessel) starte(); else zeigeEinrichtung();
</script>
</body>
</html>
